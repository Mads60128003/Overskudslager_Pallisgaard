<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tømrerlager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EAE6DA; --panel:#FFFFFF; --panel-2:#F4F1E8;
    --ink:#24261F; --ink-soft:#635E4E; --ink-faint:#8B8570; --line:#D8D0BC;
    --accent:#A8650C; --accent-strong:#8A5209; --accent-ink:#FFFFFF;
    --good:#3E7D52; --good-bg:#E4EEDF; --low:#AF3D2C; --low-bg:#F3E1DC;
    --shadow: 0 1px 2px rgba(36,38,31,0.06), 0 6px 16px -8px rgba(36,38,31,0.18);
    --radius: 10px;
    --font-display:'Big Shoulders','Arial Narrow',sans-serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1C17; --panel:#242519; --panel-2:#2C2D20;
      --ink:#EEE9D9; --ink-soft:#B3AD97; --ink-faint:#7D785F; --line:#3E3E2E;
      --accent:#E2A23A; --accent-strong:#F0B658; --accent-ink:#241800;
      --good:#69B384; --good-bg:#22301F; --low:#E08876; --low-bg:#3A231D;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1C17; --panel:#242519; --panel-2:#2C2D20;
    --ink:#EEE9D9; --ink-soft:#B3AD97; --ink-faint:#7D785F; --line:#3E3E2E;
    --accent:#E2A23A; --accent-strong:#F0B658; --accent-ink:#241800;
    --good:#69B384; --good-bg:#22301F; --low:#E08876; --low-bg:#3A231D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--paper);}
  body{
    margin:0; color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;
    padding-inline:16px; -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.02em; text-wrap:balance; margin:0;}
  .tabular{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit;} input,select{font-family:inherit; color:inherit;} a{color:inherit;}

  /* Gate */
  #gate{
    position:fixed; inset:0; background:var(--paper); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #gate[hidden]{display:none;}
  .gate-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:32px 26px; width:100%; max-width:360px; text-align:center; display:flex; flex-direction:column; gap:14px;
  }
  .gate-mark{width:40px; height:40px; margin:0 auto;}
  .gate-card h1{font-size:1.5rem;}
  .gate-card p{margin:0; color:var(--ink-soft); font-size:.85rem;}
  #gate-code{
    padding:12px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2);
    font-size:1.1rem; text-align:center; letter-spacing:.08em;
  }
  #gate-code:focus{outline:2px solid var(--accent); outline-offset:1px;}
  #gate-error{color:var(--low); font-size:.82rem; min-height:1.2em;}

  body.locked > *:not(#gate){display:none;}

  /* ---------- Topbar ---------- */
  .topbar{ position:sticky; top:0; z-index:20; background:var(--paper); padding-block:16px 12px;
    display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; border-bottom:1px solid var(--line); }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand-mark{width:34px; height:34px; flex:none;}
  .brand h1{font-size:clamp(1.3rem,1.05rem + 1vw,1.7rem); font-weight:800; color:var(--ink); line-height:1;}
  .brand p{margin:2px 0 0; font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
  .search-wrap{position:relative; flex:1 1 220px; max-width:340px;}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint);}
  #search{ width:100%; padding:9px 12px 9px 32px; border-radius:999px; border:1px solid var(--line); background:var(--panel); font-size:.88rem; color:var(--ink); }
  #search:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{ display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; padding:9px 16px; border-radius:999px;
    font-weight:700; font-size:.85rem; background:var(--panel); color:var(--ink); border:1px solid var(--line); white-space:nowrap; }
  .btn:hover{background:var(--panel-2);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-quiet{background:transparent; border-color:transparent; padding:6px 8px;}
  .btn-danger{color:var(--low);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  .chiprow{display:flex; gap:8px; overflow-x:auto; padding-block:12px 4px; scrollbar-width:thin;}
  .chip{ flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
    font-size:.82rem; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .chip .count{opacity:.65; font-family:var(--font-mono); margin-left:4px;}

  main{max-width:1080px; margin:0 auto; padding-bottom:80px;}
  .section{margin-top:28px;}
  .section-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--ink);}
  .section-head h2{font-size:1.1rem; font-weight:700;}
  .section-head .n{font-size:.78rem; color:var(--ink-faint); font-family:var(--font-mono);}
  .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(228px,1fr));}

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .card-photo{aspect-ratio:4/3; background:var(--panel-2); position:relative; overflow:hidden;}
  .card-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-photo .placeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
  .card-photo .placeholder svg{width:38px; height:38px;}
  .card-tools{position:absolute; top:6px; right:6px; display:flex; gap:4px;}
  .icon-btn{ width:28px; height:28px; border-radius:8px; border:none; background:rgba(0,0,0,.42); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn svg{width:15px; height:15px;} .icon-btn:hover{background:rgba(0,0,0,.6);}

  .card-body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .card-name{font-weight:700; font-size:.98rem; line-height:1.25;}
  .card-cat{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .card-note{font-size:.8rem; color:var(--ink-soft);}
  .qty-row{display:flex; align-items:baseline; gap:6px; margin-top:auto;}
  .qty-num{font-family:var(--font-mono); font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums;}
  .qty-unit{font-size:.78rem; color:var(--ink-soft);}
  .qty-pill{margin-left:auto; font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;}
  .qty-pill.ok{background:var(--good-bg); color:var(--good);}
  .qty-pill.low{background:var(--low-bg); color:var(--low);}
  .pick-row{display:flex; align-items:center; gap:8px; border-top:1px dashed var(--line); padding-top:10px;}
  .stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .stepper button{width:26px; height:26px; border:none; background:var(--panel-2); cursor:pointer; font-size:.95rem; color:var(--ink);}
  .stepper button:hover{background:var(--line);}
  .stepper input{width:38px; border:none; text-align:center; font-family:var(--font-mono); font-size:.85rem; background:transparent; color:var(--ink);}
  .pick-btn{flex:1; padding:7px 10px; border-radius:8px; border:none; background:var(--ink); color:var(--paper); font-weight:700; font-size:.78rem; cursor:pointer; text-transform:uppercase; letter-spacing:.03em;}
  .pick-btn:hover{background:var(--accent-strong); color:var(--accent-ink);}
  .pick-btn[disabled]{opacity:.4; cursor:not-allowed; background:var(--ink);}

  .edit-form{display:flex; flex-direction:column; gap:8px;}
  .edit-form label{font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700;}
  .edit-form input, .edit-form select{padding:7px 9px; border-radius:7px; border:1px solid var(--line); background:var(--panel); font-size:.85rem;}
  .edit-actions{display:flex; gap:8px; margin-top:4px;}
  .edit-actions .btn{flex:1; justify-content:center; padding:7px;}

  .empty{ margin-top:40px; padding:44px 24px; text-align:center; border:1px dashed var(--line); border-radius:14px;
    display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--ink-soft); }
  .empty svg{width:44px; height:44px; color:var(--ink-faint); margin-bottom:4px;}
  .empty h2{font-size:1.05rem; color:var(--ink);}
  .empty p{max-width:38ch; font-size:.88rem; margin:0;}

  .overlay{ position:fixed; inset:0; background:rgba(20,18,10,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay[hidden]{display:none;}
  @media (min-width:640px){ .overlay{align-items:center; padding:24px;} }
  .modal{ background:var(--panel); width:100%; max-width:480px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0;
    box-shadow:var(--shadow); padding:20px 20px 24px; display:flex; flex-direction:column; gap:14px; }
  @media (min-width:640px){ .modal{border-radius:16px;} }
  .modal-head{display:flex; align-items:center; justify-content:space-between;}
  .modal-head h2{font-size:1.15rem;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700;}
  .field input, .field select{padding:10px 11px; border-radius:9px; border:1px solid var(--line); background:var(--panel); font-size:.92rem;}
  .field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .cat-add-inline{display:flex; gap:8px;}
  .cat-add-inline input{flex:1;}
  .photo-pick{display:flex; gap:12px; align-items:center;}
  .photo-preview{width:64px; height:64px; border-radius:9px; background:var(--panel-2); overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); border:1px solid var(--line);}
  .photo-preview img{width:100%; height:100%; object-fit:cover;}
  .photo-preview svg{width:24px; height:24px;}
  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .modal-actions{display:flex; gap:10px; margin-top:4px;}
  .modal-actions .btn{flex:1; justify-content:center; padding:11px;}
  .form-msg{font-size:.8rem; color:var(--low); min-height:1em;}

  .fab{ position:fixed; right:18px; bottom:18px; z-index:30; width:56px; height:56px; border-radius:50%; border:none;
    background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .fab svg{width:24px; height:24px;} .fab:hover{background:var(--accent-strong);}

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:60; background:var(--ink); color:var(--paper);
    padding:10px 16px; border-radius:999px; font-size:.85rem; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none;} }
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="gate-card">
    <svg class="gate-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="20" width="30" height="6" rx="1.5" fill="var(--accent)"/>
      <rect x="5" y="12" width="24" height="6" rx="1.5" fill="var(--ink)"/>
      <rect x="8" y="4" width="18" height="6" rx="1.5" fill="var(--ink-soft)"/>
    </svg>
    <h1>Tømrerlager</h1>
    <p>Skriv firmaets adgangskode for at åbne lageret.</p>
    <input id="gate-code" type="password" placeholder="Adgangskode" autocomplete="off">
    <div id="gate-error"></div>
    <button class="btn btn-primary" id="gate-submit" style="justify-content:center;">Åbn lager</button>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="20" width="30" height="6" rx="1.5" fill="var(--accent)"/>
      <rect x="5" y="12" width="24" height="6" rx="1.5" fill="var(--ink)"/>
      <rect x="8" y="4" width="18" height="6" rx="1.5" fill="var(--ink-soft)"/>
    </svg>
    <div>
      <h1>Tømrerlager</h1>
      <p>Returmaterialer på lager</p>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Søg efter vare…" autocomplete="off">
  </div>
  <button class="btn btn-primary" id="open-add-btn">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Ny vare
  </button>
</header>

<main>
  <div class="chiprow" id="chiprow"></div>
  <div id="content"></div>
  <div class="empty" id="empty-state" hidden>
    <svg viewBox="0 0 48 48" fill="none"><rect x="6" y="20" width="36" height="20" rx="2" stroke="currentColor" stroke-width="2"/><path d="M6 20l6-10h24l6 10" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M24 20v20M6 20h36" stroke="currentColor" stroke-width="2"/></svg>
    <h2>Lageret er tomt endnu</h2>
    <p>Tilføj den første vare – tag et billede, skriv antal og vælg en kategori, fx døre, vinduer eller gulv.</p>
  </div>
</main>

<button class="fab" id="fab-add" aria-label="Tilføj vare" title="Ny vare">
  <svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="add-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="modal-head">
      <h2 id="add-title">Ny vare på lager</h2>
      <button class="btn btn-quiet" id="close-add-btn" aria-label="Luk">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="field"><label for="f-name">Varenavn</label>
      <input id="f-name" type="text" placeholder="fx Indvendig dør, hvid, 80 cm" autocomplete="off"></div>
    <div class="field"><label for="f-cat">Kategori</label><select id="f-cat"></select></div>
    <div class="cat-add-inline" id="cat-add-inline" hidden>
      <input id="f-newcat" type="text" placeholder="Navn på ny kategori">
      <button class="btn" id="f-newcat-save">Tilføj</button>
    </div>
    <button class="btn btn-quiet" id="f-newcat-toggle" style="align-self:flex-start; padding:4px 0; font-size:.78rem; color:var(--accent);">+ Ny kategori</button>
    <div class="row2">
      <div class="field"><label for="f-qty">Antal</label><input id="f-qty" type="number" min="0" step="1" value="1" inputmode="numeric"></div>
      <div class="field"><label for="f-unit">Enhed</label>
        <input id="f-unit" list="unit-options" value="stk">
        <datalist id="unit-options"><option value="stk"><option value="m"><option value="m²"><option value="pakke"><option value="liter"></datalist>
      </div>
    </div>
    <div class="field" id="photo-field">
      <label>Billede</label>
      <div class="photo-pick">
        <div class="photo-preview" id="photo-preview">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h1.5l1-1.5h7l1 1.5H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
        <label class="btn file-btn">Tag / vælg billede<input type="file" id="f-photo" accept="image/*" capture="environment"></label>
      </div>
    </div>
    <div class="field"><label for="f-note">Note (valgfri)</label><input id="f-note" type="text" placeholder="fx fra nedrivning på Kildevej 12"></div>
    <p class="form-msg" id="form-msg"></p>
    <div class="modal-actions">
      <button class="btn" id="cancel-add-btn">Annullér</button>
      <button class="btn btn-primary" id="save-add-btn">Gem vare</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ====================== OPSÆTNING ======================
     Udfyld de tre værdier herunder efter du har oprettet dit
     gratis Supabase-projekt (se opsætningsguiden):
     - SUPABASE_URL og SUPABASE_ANON_KEY findes under
       Project Settings > API i Supabase.
     - SHARED_PASSCODE er den adgangskode dine medarbejdere
       skal skrive for at åbne lageret. Skift den til noget
       kun I kender, før du deler linket.
     ========================================================= */
  var SUPABASE_URL = gyydlunynnsvfruntpvm
  var SUPABASE_ANON_KEY = sb_publishable_9FbNUsvghITscGAiAwVGiQ_2shgW1Ki
  var SHARED_PASSCODE = Pall6012
  var PHOTO_BUCKET = "billeder";
  /* ======================================================== */

  var sb = (SUPABASE_URL.indexOf("YOUR_SUPABASE_URL") === -1)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  var state = { categories:[], items:[], activeCat:"all", search:"", editingId:null, confirmDeleteId:null };
  var pendingPhotoPath = null;
  var pollTimer = null;

  var els = {
    chiprow: document.getElementById('chiprow'),
    content: document.getElementById('content'),
    empty: document.getElementById('empty-state'),
    search: document.getElementById('search'),
    overlay: document.getElementById('add-overlay'),
    fName: document.getElementById('f-name'),
    fCat: document.getElementById('f-cat'),
    fQty: document.getElementById('f-qty'),
    fUnit: document.getElementById('f-unit'),
    fPhoto: document.getElementById('f-photo'),
    fNote: document.getElementById('f-note'),
    photoPreview: document.getElementById('photo-preview'),
    formMsg: document.getElementById('form-msg'),
    toast: document.getElementById('toast'),
    catAddInline: document.getElementById('cat-add-inline'),
    fNewcat: document.getElementById('f-newcat'),
    gate: document.getElementById('gate'),
    gateCode: document.getElementById('gate-code'),
    gateError: document.getElementById('gate-error'),
    gateSubmit: document.getElementById('gate-submit'),
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showToast(msg){
    els.toast.textContent = msg; els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ els.toast.classList.remove('show'); }, 2600);
  }
  function placeholderIcon(){
    return '<div class="placeholder"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h1.5l1-1.5h7l1 1.5H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg></div>';
  }
  function photoUrl(path){
    if(!path || !sb) return null;
    return sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
  }

  /* ---------------- gate ---------------- */

  function tryUnlock(){
    var val = els.gateCode.value.trim();
    if(val && val === SHARED_PASSCODE){
      try{ localStorage.setItem('tl_unlocked', '1'); }catch(e){}
      els.gate.hidden = true;
      document.body.classList.remove('locked');
      boot();
    } else {
      els.gateError.textContent = 'Forkert adgangskode. Prøv igen.';
      els.gateCode.focus();
      els.gateCode.select();
    }
  }
  els.gateSubmit.addEventListener('click', tryUnlock);
  els.gateCode.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });

  var alreadyUnlocked = false;
  try{ alreadyUnlocked = localStorage.getItem('tl_unlocked') === '1'; }catch(e){}
  if(alreadyUnlocked){
    els.gate.hidden = true;
    document.body.classList.remove('locked');
  }

  /* ---------------- rendering ---------------- */

  function catName(id){
    var c = state.categories.find(function(x){ return x.id === id; });
    return c ? c.name : 'Ukategoriseret';
  }

  function renderChips(){
    var counts = {};
    state.items.forEach(function(it){ counts[it.category_id] = (counts[it.category_id]||0) + 1; });
    var html = '<button class="chip" data-cat="all" aria-pressed="'+(state.activeCat==='all')+'">Alle <span class="count">'+state.items.length+'</span></button>';
    state.categories.forEach(function(c){
      html += '<button class="chip" data-cat="'+c.id+'" aria-pressed="'+(state.activeCat===c.id)+'">'+esc(c.name)+' <span class="count">'+(counts[c.id]||0)+'</span></button>';
    });
    els.chiprow.innerHTML = html;
    els.chiprow.querySelectorAll('.chip').forEach(function(btn){
      btn.addEventListener('click', function(){ state.activeCat = btn.getAttribute('data-cat'); render(); });
    });
  }

  function itemCardHtml(it){
    var low = it.quantity <= 0;
    var url = photoUrl(it.photo_path);
    var photoBlock = url ? '<img src="'+esc(url)+'" alt="">' : placeholderIcon();
    var editing = state.editingId === it.id;
    var confirming = state.confirmDeleteId === it.id;
    var body;
    if(editing){
      var catOptions = state.categories.map(function(c){
        return '<option value="'+c.id+'"'+(c.id===it.category_id?' selected':'')+'>'+esc(c.name)+'</option>';
      }).join('');
      body =
        '<div class="edit-form" data-edit-for="'+it.id+'">'+
          '<label>Navn</label><input type="text" class="ed-name" value="'+esc(it.name)+'">'+
          '<label>Kategori</label><select class="ed-cat">'+catOptions+'</select>'+
          '<div class="row2"><div><label>Antal</label><input type="number" min="0" class="ed-qty" value="'+it.quantity+'"></div>'+
          '<div><label>Enhed</label><input type="text" class="ed-unit" value="'+esc(it.unit||'stk')+'"></div></div>'+
          '<label>Note</label><input type="text" class="ed-note" value="'+esc(it.note||'')+'">'+
          '<div class="edit-actions"><button class="btn ed-cancel">Annullér</button><button class="btn btn-primary ed-save">Gem</button></div>'+
          '<button class="btn btn-quiet btn-danger ed-delete" style="align-self:flex-start;">'+(confirming?'Bekræft sletning?':'Slet vare')+'</button>'+
        '</div>';
    } else {
      body =
        '<div class="card-name">'+esc(it.name)+'</div>'+
        '<div class="card-cat">'+esc(catName(it.category_id))+'</div>'+
        (it.note ? '<div class="card-note">'+esc(it.note)+'</div>' : '')+
        '<div class="qty-row"><span class="qty-num tabular">'+it.quantity+'</span><span class="qty-unit">'+esc(it.unit||'stk')+'</span>'+
        '<span class="qty-pill '+(low?'low':'ok')+'">'+(low?'Tomt':'På lager')+'</span></div>'+
        '<div class="pick-row" data-pick-for="'+it.id+'">'+
          '<div class="stepper"><button class="pk-minus" type="button" aria-label="Færre">−</button>'+
          '<input type="number" class="pk-amt" min="1" max="'+Math.max(it.quantity,1)+'" value="1" inputmode="numeric">'+
          '<button class="pk-plus" type="button" aria-label="Flere">+</button></div>'+
          '<button class="pick-btn" type="button"'+(low?' disabled':'')+'>Pluk</button>'+
        '</div>';
    }
    return (
      '<div class="card" data-item-id="'+it.id+'">'+
        '<div class="card-photo">'+photoBlock+
          '<div class="card-tools"><button class="icon-btn ed-toggle" title="Rediger" aria-label="Rediger">'+
            '<svg viewBox="0 0 20 20" fill="none"><path d="M13.5 3.5l3 3L6 17H3v-3L13.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></div>'+
        '</div>'+
        '<div class="card-body">'+body+'</div>'+
      '</div>'
    );
  }

  function render(){
    var term = state.search.trim().toLowerCase();
    var filtered = state.items.filter(function(it){
      if(state.activeCat !== 'all' && it.category_id !== state.activeCat) return false;
      if(term && it.name.toLowerCase().indexOf(term) === -1) return false;
      return true;
    });
    els.empty.hidden = state.items.length > 0;
    if(filtered.length === 0){
      els.content.innerHTML = state.items.length > 0 ? '<p style="color:var(--ink-soft); margin-top:24px;">Ingen varer matcher søgningen.</p>' : '';
      renderChips(); bindCardEvents(); return;
    }
    var byCat = {}, order = [];
    filtered.forEach(function(it){
      var key = it.category_id || 'uncategorized';
      if(!byCat[key]){ byCat[key]=[]; order.push(key); }
      byCat[key].push(it);
    });
    order.sort(function(a,b){ return catName(a).localeCompare(catName(b),'da'); });
    var html = '';
    order.forEach(function(key){
      var list = byCat[key].slice().sort(function(a,b){ return a.name.localeCompare(b.name,'da'); });
      html += '<div class="section"><div class="section-head"><h2>'+esc(catName(key))+'</h2><span class="n">'+list.length+' varer</span></div>'+
        '<div class="grid">'+ list.map(itemCardHtml).join('') +'</div></div>';
    });
    els.content.innerHTML = html;
    renderChips(); bindCardEvents();
  }

  function bindCardEvents(){
    els.content.querySelectorAll('.card').forEach(function(card){
      var id = card.getAttribute('data-item-id');
      var it = state.items.find(function(x){ return x.id===id; });
      if(!it) return;
      var edBtn = card.querySelector('.ed-toggle');
      if(edBtn) edBtn.addEventListener('click', function(){
        state.editingId = (state.editingId===id) ? null : id; state.confirmDeleteId = null; render();
      });
      var minus = card.querySelector('.pk-minus'), plus = card.querySelector('.pk-plus'), amt = card.querySelector('.pk-amt'), pickBtn = card.querySelector('.pick-btn');
      if(amt){
        minus.addEventListener('click', function(){ amt.value = Math.max(1, (parseInt(amt.value,10)||1) - 1); });
        plus.addEventListener('click', function(){ amt.value = Math.min(it.quantity, (parseInt(amt.value,10)||1) + 1); });
      }
      if(pickBtn) pickBtn.addEventListener('click', function(){ pickItem(it, parseInt(amt.value,10)||1); });
      var edSave = card.querySelector('.ed-save');
      if(edSave) edSave.addEventListener('click', function(){
        var form = card.querySelector('.edit-form');
        saveEdit(it, {
          name: form.querySelector('.ed-name').value.trim(),
          category_id: form.querySelector('.ed-cat').value,
          quantity: Math.max(0, parseInt(form.querySelector('.ed-qty').value,10)||0),
          unit: form.querySelector('.ed-unit').value.trim() || 'stk',
          note: form.querySelector('.ed-note').value.trim(),
        });
      });
      var edCancel = card.querySelector('.ed-cancel');
      if(edCancel) edCancel.addEventListener('click', function(){ state.editingId=null; render(); });
      var edDelete = card.querySelector('.ed-delete');
      if(edDelete) edDelete.addEventListener('click', function(){
        if(state.confirmDeleteId === id){ deleteItem(it); } else { state.confirmDeleteId = id; render(); }
      });
    });
  }

  /* ---------------- data ops ---------------- */

  function refreshAll(){
    if(!sb) return;
    Promise.all([
      sb.from('categories').select('*').order('name'),
      sb.from('items').select('*')
    ]).then(function(res){
      var catRes = res[0], itemRes = res[1];
      if(!catRes.error) state.categories = catRes.data || [];
      if(!itemRes.error) state.items = itemRes.data || [];
      populateCatSelect();
      render();
    }).catch(function(){ showToast('Kunne ikke hente lagerdata. Tjek din internetforbindelse.'); });
  }

  function pickItem(it, amount){
    if(!sb) return;
    amount = Math.max(1, Math.min(amount, it.quantity));
    var newQty = Math.max(0, it.quantity - amount);
    sb.from('items').update({ quantity:newQty, updated_at:new Date().toISOString() }).eq('id', it.id).then(function(res){
      if(res.error){ showToast('Kunne ikke opdatere lageret.'); return; }
      showToast('Plukkede '+amount+' '+(it.unit||'stk')+' – '+it.name);
      refreshAll();
    });
  }

  function saveEdit(it, data){
    if(!sb) return;
    if(!data.name){ showToast('Varen skal have et navn.'); return; }
    sb.from('items').update({
      name:data.name, category_id:data.category_id, quantity:data.quantity, unit:data.unit, note:data.note, updated_at:new Date().toISOString()
    }).eq('id', it.id).then(function(res){
      if(res.error){ showToast('Kunne ikke gemme ændringen.'); return; }
      state.editingId = null; showToast('Vare opdateret.'); refreshAll();
    });
  }

  function deleteItem(it){
    if(!sb) return;
    sb.from('items')['delete']().eq('id', it.id).then(function(res){
      if(res.error){ showToast('Kunne ikke slette varen.'); return; }
      state.editingId=null; state.confirmDeleteId=null; showToast('Vare slettet.'); refreshAll();
    });
  }

  function addCategory(name, cb){
    if(!sb || !name) return;
    sb.from('categories').insert({ name:name }).select().then(function(res){
      if(res.error || !res.data || !res.data[0]){ showToast('Kunne ikke oprette kategorien.'); return; }
      refreshAll();
      if(cb) cb(res.data[0].id);
    });
  }

  /* ---------------- add-item modal ---------------- */

  function resetForm(){
    els.fName.value=''; els.fQty.value='1'; els.fUnit.value='stk'; els.fNote.value=''; els.fPhoto.value='';
    els.formMsg.textContent=''; pendingPhotoPath=null;
    els.photoPreview.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h1.5l1-1.5h7l1 1.5H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>';
    els.catAddInline.hidden = true; els.fNewcat.value='';
    populateCatSelect();
  }
  function populateCatSelect(){
    if(state.categories.length===0){ els.fCat.innerHTML = '<option value="">Opret en kategori først</option>'; return; }
    var prev = els.fCat.value;
    els.fCat.innerHTML = state.categories.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('');
    if(prev && state.categories.some(function(c){return c.id===prev;})) els.fCat.value = prev;
  }
  function openAdd(){ resetForm(); els.overlay.hidden=false; setTimeout(function(){ els.fName.focus(); }, 30); }
  function closeAdd(){ els.overlay.hidden = true; }

  document.getElementById('open-add-btn').addEventListener('click', openAdd);
  document.getElementById('fab-add').addEventListener('click', openAdd);
  document.getElementById('close-add-btn').addEventListener('click', closeAdd);
  document.getElementById('cancel-add-btn').addEventListener('click', closeAdd);
  els.overlay.addEventListener('click', function(e){ if(e.target===els.overlay) closeAdd(); });

  document.getElementById('f-newcat-toggle').addEventListener('click', function(){
    els.catAddInline.hidden = !els.catAddInline.hidden;
    if(!els.catAddInline.hidden) els.fNewcat.focus();
  });
  document.getElementById('f-newcat-save').addEventListener('click', function(){
    var name = els.fNewcat.value.trim(); if(!name) return;
    addCategory(name, function(id){ els.catAddInline.hidden=true; els.fNewcat.value=''; setTimeout(function(){ els.fCat.value=id; }, 150); });
  });

  els.fPhoto.addEventListener('change', function(){
    var file = els.fPhoto.files && els.fPhoto.files[0];
    if(!file || !sb) return;
    els.photoPreview.innerHTML = '<span style="font-size:.65rem;color:var(--ink-faint);">Uploader…</span>';
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var path = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()) + '.' + ext;
    sb.storage.from(PHOTO_BUCKET).upload(path, file, { upsert:false }).then(function(res){
      if(res.error){ showToast('Billedet kunne ikke uploades.'); els.photoPreview.innerHTML='<span style="font-size:.6rem;color:var(--low);">Fejl</span>'; return; }
      pendingPhotoPath = path;
      els.photoPreview.innerHTML = '<img src="'+esc(photoUrl(path))+'" alt="">';
    });
  });

  document.getElementById('save-add-btn').addEventListener('click', function(){
    var name = els.fName.value.trim();
    var category_id = els.fCat.value;
    var qty = Math.max(0, parseInt(els.fQty.value,10)||0);
    var unit = els.fUnit.value.trim() || 'stk';
    var note = els.fNote.value.trim();
    if(!name){ els.formMsg.textContent='Skriv et varenavn.'; els.fName.focus(); return; }
    if(!category_id){ els.formMsg.textContent='Vælg eller opret en kategori.'; return; }
    if(!sb){ els.formMsg.textContent='Forbindelsen til lagersystemet mangler at blive sat op.'; return; }
    sb.from('items').insert({
      name:name, category_id:category_id, quantity:qty, unit:unit, note:note, photo_path:pendingPhotoPath
    }).then(function(res){
      if(res.error){ els.formMsg.textContent='Kunne ikke gemme varen. Prøv igen.'; return; }
      closeAdd(); showToast('Tilføjet: '+name); refreshAll();
    });
  });

  els.search.addEventListener('input', function(){ state.search = els.search.value; render(); });

  /* ---------------- boot ---------------- */

  function boot(){
    if(!sb){
      showToast('Lagersystemet er ikke sat op endnu – indsæt Supabase-nøglerne i koden.');
      return;
    }
    refreshAll();
    clearInterval(pollTimer);
    pollTimer = setInterval(refreshAll, 15000);
  }

  if(alreadyUnlocked) boot();
})();
</script>
</body>
</html>
